# ============================================================================
# pytest конфигурация - ВАРИАНТ 2: С ЛОГАМИ
# ============================================================================
# Детальный вывод: показывает print() и logging из тестов и валидаторов
# 
# Использование:
#   pytest -c pytest_with_logs.ini
# ============================================================================

[pytest]
# Где искать тесты (теперь ищем в текущей директории tests/)
testpaths = .

# Паттерны для поиска тестов
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Опции запуска
addopts = 
    -v
    -s
    --tb=short
    --cov=../excel_actions
    --cov=../wb_api
    --cov=../main_function
    --cov-report=term-missing
    --cov-report=html:htmlcov

# Маркеры для группировки тестов
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests


