# ============================================================================
# pytest конфигурация - ВАРИАНТ 1: МИНИМАЛЬНЫЙ (без логов)
# ============================================================================
# Быстрый запуск, только результаты тестов и coverage
# 
# Чтобы переключиться на ВАРИАНТ 2 (с логами):
# - Раскомментируй строку с -s ниже
# ============================================================================

[pytest]
# Где искать тесты (теперь ищем в текущей директории tests/)
testpaths = .

# Паттерны для поиска тестов
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Опции запуска
addopts = 
    -v
    --tb=short
    --cov=../excel_actions
    --cov=../wb_api
    --cov=../main_function
    --cov-config=../.coveragerc
    --cov-report=term-missing
    --cov-report=html:htmlcov

# Маркеры для группировки тестов (можно использовать: pytest -m unit)
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests


